[package]
name = "csilgen-common"
version = "0.1.0"
edition = "2024"
description = "Shared utilities, types, and error handling for csilgen"
license = "Apache-2.0"

[features]
default = []
testing = ["dep:tempfile"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true

# Optional testing dependencies
tempfile = { version = "3.0", optional = true }

[dev-dependencies]
tempfile = "3.0"
