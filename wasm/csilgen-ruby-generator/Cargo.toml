[package]
name = "csilgen-ruby-generator"
version = "0.1.0"
edition = "2024"
authors = ["CSIL Team"]
license = "Apache-2.0"
description = "Ruby code generator WASM module for csilgen"
homepage = "https://github.com/catalystcommunity/csilgen"
repository = "https://github.com/catalystcommunity/csilgen"

# The `rlib` alongside `cdylib` lets the integration tests in `tests/` link this
# crate as a normal library and call `generate_ruby_code_from_serialized` to
# assert on emitted Ruby; `cdylib` alone is not linkable by an integration test.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
csilgen-common = { path = "../../crates/csilgen-common", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
convert_case = "0.6"
