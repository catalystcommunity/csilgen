name: csilgen-asset-build
description: "Build and upload one CLI or generator cache asset."
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 5400
  priority: 10
  working_dir: /job
  capabilities:
    - builder
environment:
  CSILGEN_JOB: asset-build
run_local:
  user: root
