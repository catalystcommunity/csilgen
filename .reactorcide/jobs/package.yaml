name: csilgen-package
description: "Build all release archives without publishing them."
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:dev
  command: runnerlib run --plugin-dir /job/src/.reactorcide/plugins --job-command true
  timeout: 5400
  priority: 10
  capabilities:
    - docker
  run_as:
    user: root
environment:
  CSILGEN_JOB: package
run_local:
  user: root
