name: csilgen-asset-transport
description: "Build and upload one transport cache asset."
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 900
  priority: 10
  working_dir: /job
environment:
  CSILGEN_JOB: asset-build
run_local:
  user: host
