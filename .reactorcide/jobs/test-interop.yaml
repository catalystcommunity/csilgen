name: csilgen-test-interop
description: "Run the cross-language interoperability matrix."
triggers:
  events:
    - pull_request_opened
    - pull_request_updated
  branches:
    - main
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 3600
  priority: 10
  working_dir: /job
  depends_on:
    - csilgen-conventional-commits
  capabilities:
    - docker
  run_as:
    user: root
environment:
  REACTORCIDE_CSILGEN_JOB: interop
run_local:
  user: root
