name: csilgen-release
description: "Create the umbrella tag and publish all release archives."
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:dev
  command: runnerlib run --plugin-dir /job/src/.reactorcide/plugins --job-command true
  timeout: 5400
  priority: 15
  capabilities:
    - docker
  run_as:
    user: root
environment:
  CSILGEN_JOB: release
  REACTORCIDE_REPO: catalystcommunity/csilgen
  GITHUB_PAT: "${secret:catalystcommunity/ci:githubpat}"
