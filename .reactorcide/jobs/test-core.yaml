name: csilgen-test-core
description: "Check and test the Rust workspace."
triggers:
  events:
    - pull_request_opened
    - pull_request_updated
  branches:
    - main
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 2400
  priority: 10
  working_dir: /job
  depends_on:
    - csilgen-conventional-commits
  run_as:
    user: root
environment:
  CSILGEN_JOB: core
run_local:
  user: root
