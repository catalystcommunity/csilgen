name: csilgen-conventional-commits
description: "Validate pull request commit subjects."
triggers:
  events:
    - pull_request_opened
    - pull_request_updated
  branches:
    - main
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 300
  priority: 10
  working_dir: /job
environment:
  CSILGEN_JOB: conventional-commits
run_local:
  user: host
